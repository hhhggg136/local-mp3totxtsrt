name: Publish verified Windows installers
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require a successful current Windows verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow windows.yml --branch codex/windows-port --limit 1 --json databaseId --jq '.[0].databaseId' > build-id.txt
          build_id=$(cat build-id.txt)
          gh run watch "$build_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_id" > build.json
          python3 - <<'PY'
          import json,subprocess
          data=json.load(open('build.json'))
          assert data['conclusion']=='success' and data['head_branch']=='codex/windows-port'
          assert data['path']=='.github/workflows/windows.yml'
          changed=subprocess.check_output(['git','diff','--name-only',data['head_sha'],'HEAD'],text=True).splitlines()
          assert set(changed)<={'.github/workflows/publish-windows.yml','docs/WINDOWS_RELEASE_0_7_0.md'},changed
          open('verified-sha.txt','w').write(data['head_sha'])
          PY
      - name: Download and verify installer bytes and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_id=$(cat build-id.txt)
          for arch in x64 arm64; do
            gh run download "$build_id" --repo "$GITHUB_REPOSITORY" --name "windows-installer-$arch" --dir "release/$arch"
            gh run download "$build_id" --repo "$GITHUB_REPOSITORY" --name "native-verification-$arch" --dir "verification/$arch"
          done
          gh run download "$build_id" --repo "$GITHUB_REPOSITORY" --name translation-verification --dir verification/translation
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          for arch in ['x64','arm64']:
              for name in ['native-verification.json','installed-verification.json']:
                  assert json.loads((Path('verification')/arch/name).read_text())['passed'] is True
              exe=next((Path('release')/arch).glob('*Setup.exe'))
              h=hashlib.sha256()
              with exe.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''):h.update(chunk)
              assert h.hexdigest().lower() in (Path('release')/arch/('SHA256-'+arch+'.txt')).read_text(encoding='utf-8-sig').lower()
          assert json.loads(Path('verification/arm64/translation-verification.json').read_text())['passed'] is True
          translation_reports=list(Path('verification/translation').rglob('translation-verification.json'))
          assert translation_reports
          assert all(json.loads(p.read_text())['passed'] is True for p in translation_reports)
          PY
          zip -r Windows-verification.zip verification
      - name: Publish both tested installers together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(cat verified-sha.txt)
          cp docs/WINDOWS_RELEASE_0_7_0.md release-notes.md
          printf '\n自动验证记录：https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$(cat build-id.txt)" >> release-notes.md
          gh release create windows-v0.7.0 --repo "$GITHUB_REPOSITORY" --target "$sha" --draft --prerelease --title '听听兽 0.7.0 · Windows 预览版' --notes-file release-notes.md
          gh release upload windows-v0.7.0 --repo "$GITHUB_REPOSITORY" release/x64/* release/arm64/* Windows-verification.zip
          gh release edit windows-v0.7.0 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

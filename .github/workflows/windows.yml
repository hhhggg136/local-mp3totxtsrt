name: Windows local build
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-port]
    paths: ['windows/**', 'launcher/native/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  translation:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r windows/requirements-build.txt -r windows/requirements-translate.txt
      - run: python windows/build_package.py --worker
      - run: python windows/build_translation_catalog.py .local/translation-worker/dist/tingting-translate/translation-catalog.json
      - run: python windows/tests/translation_probe.py .local/translation-worker/dist/tingting-translate .local/translation-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: translation-worker
          path: .local/translation-worker/dist/tingting-translate
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: translation-verification
          path: |
            .local/translation-verification.json
            .local/translation-worker/dist/tingting-translate/translation-catalog.json
          include-hidden-files: true
  native:
    needs: translation
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Build native local runtime
        run: python windows/build_runtime.py --arch ${{ matrix.arch }}
      - name: Test real inference and Chinese paths
        run: python windows/tests/native_probe.py .local/win-${{ matrix.arch }}/runtime
      - name: Portable core tests
        run: python -m unittest discover -s windows/tests -p 'test_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: translation-worker
          path: .local/translation-artifact
      - run: python -m pip install -r windows/requirements-build.txt
      - run: python windows/build_package.py --arch ${{ matrix.arch }} --translation .local/translation-artifact
      - name: Verify local translation worker under ARM64 x64 emulation
        if: matrix.arch == 'arm64'
        run: |
          python windows/build_translation_catalog.py .local/translation-artifact/translation-catalog.json
          python windows/tests/translation_probe.py .local/translation-artifact .local/win-arm64/translation-verification.json
      - name: Build per-user installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler missing' }
          & $compiler.FullName /DAppArch=${{ matrix.arch }} /O"$pwd\dist\windows" windows/installer.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
      - name: Install and test actual packaged executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows/*Setup.exe | Select-Object -First 1
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon' -Wait -PassThru
          if ($process.ExitCode) { throw 'Installation failed' }
          $exe = "$env:LOCALAPPDATA\Programs\TingTingBeast\TingTingBeast.exe"
          $report = "$pwd\.local\win-${{ matrix.arch }}\installed-verification.json"
          $process = Start-Process $exe -ArgumentList "--self-test `"$report`"" -Wait -PassThru
          if ($process.ExitCode -or !(Test-Path $report)) { throw 'Installed executable verification failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.passed) { throw (Get-Content $report -Raw) }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List | Out-File dist/windows/SHA256-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-${{ matrix.arch }}
          path: dist/windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-verification-${{ matrix.arch }}
          path: |
            .local/win-${{ matrix.arch }}/native-verification.json
            .local/win-${{ matrix.arch }}/installed-verification.json
            .local/win-${{ matrix.arch }}/translation-verification.json
          include-hidden-files: true
          if-no-files-found: warn
